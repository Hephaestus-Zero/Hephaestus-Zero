<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 196" width="840" height="196" role="img" aria-label="Systems telemetry: 1.3 ms AST slice, minus 96.2% context tokens, 0.0% Landlock CPU overhead">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    </style>
  </defs>

  <!-- Quiet Instrument Eyebrow -->
  <text x="0" y="20" class="sans" font-size="10.5" font-weight="600" letter-spacing="1.4" fill="#57606a">SYSTEMS · KERNEL CONTAINMENT · AGENT INFRASTRUCTURE</text>
  <text x="840" y="20" text-anchor="end" class="mono" font-size="10.5" font-weight="500" letter-spacing="0.6" fill="#57606a">C11  ·  LINUX LSM  ·  ADVERSARIAL VERIFICATION</text>

  <!-- Top Hairline + Racing Stripe (Accent 1/3) -->
  <line x1="0" y1="34" x2="840" y2="34" stroke="#d8dee4" stroke-width="1"/>
  <line x1="0" y1="34" x2="56" y2="34" stroke="#9a5b13" stroke-width="2"/>

  <!-- Column Dividers -->
  <line x1="272" y1="52" x2="272" y2="168" stroke="#d8dee4" stroke-width="1"/>
  <line x1="556" y1="52" x2="556" y2="168" stroke="#d8dee4" stroke-width="1"/>

  <!-- Column 1: 1.3 ms -->
  <text x="0" y="96" class="mono" letter-spacing="-1.5" fill="#0f1419"><tspan font-size="44" font-weight="700">1.3</tspan><tspan dx="6" font-size="19" font-weight="500" letter-spacing="0" fill="#57606a">ms</tspan></text>
  <text x="0" y="126" class="sans" font-size="13.5" font-weight="600" fill="#0f1419">hslice · mmap 3-gram &amp; AST slicer</text>
  <text x="0" y="148" class="sans" font-size="12" fill="#57606a">Single-shot symbol &amp; call-graph slice</text>
  <line x1="0" y1="166" x2="160" y2="166" stroke="#d8dee4" stroke-width="1.5"/>
  <line x1="0" y1="166" x2="24" y2="166" stroke="#9a5b13" stroke-width="2"/>

  <!-- Column 2: −96.2% -->
  <text x="296" y="96" class="mono" font-size="44" font-weight="700" letter-spacing="-1.5" fill="#0f1419">&#x2212;96.2%</text>
  <text x="296" y="126" class="sans" font-size="13.5" font-weight="600" fill="#0f1419">Agent file-read context tokens</text>
  <text x="296" y="148" class="sans" font-size="12" fill="#57606a">36,517 &#x2192; 1,384 tok across 1 turn</text>
  <line x1="296" y1="166" x2="456" y2="166" stroke="#d8dee4" stroke-width="1.5"/>
  <line x1="296" y1="166" x2="302" y2="166" stroke="#9a5b13" stroke-width="2"/>

  <!-- Column 3: 0.0% -->
  <text x="580" y="96" class="mono" font-size="44" font-weight="700" letter-spacing="-1.5" fill="#0f1419">0.0%</text>
  <text x="580" y="126" class="sans" font-size="13.5" font-weight="600" fill="#0f1419">hshield · Landlock ABI v6 sandbox</text>
  <text x="580" y="148" class="sans" font-size="12" fill="#57606a">Unprivileged FS, TCP &amp; Pickle VM gate</text>
  <line x1="580" y1="166" x2="740" y2="166" stroke="#d8dee4" stroke-width="1.5"/>

  <!-- Bottom Hairline -->
  <line x1="0" y1="186" x2="840" y2="186" stroke="#d8dee4" stroke-width="1"/>
</svg>
