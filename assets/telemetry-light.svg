<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 134" width="840" height="134" role="img" aria-label="Theory + Zero bare-metal lab telemetry: 1.3 ms hslice C11 AST slice, minus 96.2% context tokens with hslice --audit, 0.0% hshield Landlock ABI v6 sandbox overhead">
