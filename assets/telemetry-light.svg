  <text x="2" y="72" class="mono" letter-spacing="-1.5" fill="#0f1419"><tspan font-size="38" font-weight="700">1.3</tspan><tspan dx="6" font-size="16.5" font-weight="500" letter-spacing="0" fill="#57606a">ms</tspan></text>
  <text x="2" y="94" class="sans" font-size="13" font-weight="600" fill="#0f1419">hslice · C11 AST code slicer</text>
