<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 134" width="840" height="134" role="img" aria-label="Hephaestus v0.1.0 modular 5-organ agent spine: minus 97.5% symbol slice tokens at 39.6x density, 0.0% Landlock kernel and test gate overhead, 5 of 5 selective organs">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    </style>
  </defs>

  <!-- Lab Eyebrow -->
  <text x="2" y="13" class="sans" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#8b949e">HEPHAESTUS v0.1.0 · MODULAR C11 &amp; SQLITE AGENT SPINE</text>
  <text x="838" y="13" text-anchor="end" class="mono" font-size="10.5" font-weight="500" letter-spacing="0.5" fill="#8b949e">SLICE · SHIELD · VERIFY · MEMORY · VOICE</text>

  <!-- Top Hairline + Racing Stripe (Accent 1/3) -->
  <line x1="2" y1="24" x2="838" y2="24" stroke="#21262d" stroke-width="1"/>
  <line x1="2" y1="24" x2="58" y2="24" stroke="#df9f64" stroke-width="2"/>

  <!-- Column Dividers -->
  <line x1="274" y1="36" x2="274" y2="122" stroke="#21262d" stroke-width="1"/>
  <line x1="560" y1="36" x2="560" y2="122" stroke="#21262d" stroke-width="1"/>

  <!-- Column 1: −97.5% -->
  <text x="2" y="72" class="mono" font-size="38" font-weight="700" letter-spacing="-1.5" fill="#ece8e1">&#x2212;97.5%</text>
  <text x="2" y="94" class="sans" font-size="13" font-weight="600" fill="#ece8e1">hephaestus · symbol slice economy</text>
  <text x="2" y="111" class="sans" font-size="11.5" fill="#8b949e">39.6x density · 1.3 ms mmap 3-gram AST</text>
  <line x1="2" y1="122" x2="162" y2="122" stroke="#21262d" stroke-width="1.5"/>
  <line x1="2" y1="122" x2="14" y2="122" stroke="#df9f64" stroke-width="2"/>

  <!-- Column 2: 0.0% -->
  <text x="298" y="72" class="mono" font-size="38" font-weight="700" letter-spacing="-1.5" fill="#ece8e1">0.0%</text>
  <text x="298" y="94" class="sans" font-size="13" font-weight="600" fill="#ece8e1">shield + verify · kernel &amp; test gate</text>
  <text x="298" y="111" class="sans" font-size="11.5" fill="#8b949e">Landlock LSM · shell &amp; sha256 test guard</text>
  <line x1="298" y1="122" x2="458" y2="122" stroke="#21262d" stroke-width="1.5"/>
  <line x1="298" y1="122" x2="318" y2="122" stroke="#df9f64" stroke-width="2"/>

  <!-- Column 3: 5/5 organs -->
  <text x="584" y="72" class="mono" letter-spacing="-1.5" fill="#ece8e1"><tspan font-size="38" font-weight="700">5/5</tspan><tspan dx="6" font-size="16" font-weight="500" letter-spacing="0" fill="#8b949e">organs</tspan></text>
  <text x="584" y="94" class="sans" font-size="13" font-weight="600" fill="#ece8e1">memory + voice · selective spine</text>
  <text x="584" y="111" class="sans" font-size="11.5" fill="#8b949e">SQLite JTMS + FTS5 · &lt;160 tok pushback</text>
