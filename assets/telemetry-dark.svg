<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 148" width="840" height="148" role="img" aria-label="Theory + Zero bare-metal lab telemetry: 1.3 ms hslice C11 AST slice, minus 96.2% context tokens with hslice --audit, 0.0% hshield Landlock ABI v6 sandbox overhead">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    </style>
  </defs>

  <!-- Lab Eyebrow -->
  <text x="2" y="15" class="sans" font-size="10.5" font-weight="600" letter-spacing="1.3" fill="#8b949e">THEORY + ZERO · BARE-METAL AI INFRASTRUCTURE LAB</text>
  <text x="838" y="15" text-anchor="end" class="mono" font-size="10.5" font-weight="500" letter-spacing="0.5" fill="#8b949e">C11 · LINUX LANDLOCK · PERSISTENT MEMORY</text>

  <!-- Top Hairline + Racing Stripe (Accent 1/3) -->
  <line x1="2" y1="27" x2="838" y2="27" stroke="#21262d" stroke-width="1"/>
  <line x1="2" y1="27" x2="58" y2="27" stroke="#df9f64" stroke-width="2"/>

  <!-- Column Dividers -->
  <line x1="274" y1="42" x2="274" y2="134" stroke="#21262d" stroke-width="1"/>
  <line x1="560" y1="42" x2="560" y2="134" stroke="#21262d" stroke-width="1"/>

  <!-- Column 1: 1.3 ms -->
  <text x="2" y="80" class="mono" letter-spacing="-1.5" fill="#ece8e1"><tspan font-size="40" font-weight="700">1.3</tspan><tspan dx="6" font-size="17" font-weight="500" letter-spacing="0" fill="#8b949e">ms</tspan></text>
  <text x="2" y="104" class="sans" font-size="13" font-weight="600" fill="#ece8e1">hslice · C11 AST code slicer</text>
  <text x="2" y="122" class="sans" font-size="11.5" fill="#8b949e">mmap 3-gram index · lazy mtime refresh</text>
  <line x1="2" y1="134" x2="162" y2="134" stroke="#21262d" stroke-width="1.5"/>
  <line x1="2" y1="134" x2="26" y2="134" stroke="#df9f64" stroke-width="2"/>

  <!-- Column 2: −96.2% -->
  <text x="298" y="80" class="mono" font-size="40" font-weight="700" letter-spacing="-1.5" fill="#ece8e1">&#x2212;96.2%</text>
  <text x="298" y="104" class="sans" font-size="13" font-weight="600" fill="#ece8e1">Agent file-read context tokens</text>
  <text x="298" y="122" class="sans" font-size="11.5" fill="#8b949e">hslice --audit · 36,517 &#x2192; 1,384 tok / turn</text>
  <line x1="298" y1="134" x2="458" y2="134" stroke="#21262d" stroke-width="1.5"/>
  <line x1="298" y1="134" x2="306" y2="134" stroke="#df9f64" stroke-width="2"/>

  <!-- Column 3: 0.0% -->
  <text x="584" y="80" class="mono" font-size="40" font-weight="700" letter-spacing="-1.5" fill="#ece8e1">0.0%</text>
  <text x="584" y="104" class="sans" font-size="13" font-weight="600" fill="#ece8e1">hshield · Landlock ABI v6 gate</text>
  <text x="584" y="122" class="sans" font-size="11.5" fill="#8b949e">FS + TCP sandbox · hveritas · ocx-plasma</text>
