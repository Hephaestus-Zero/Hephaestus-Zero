<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 184" width="840" height="184" role="img" aria-label="Systems telemetry: 1.3 ms AST slice, minus 96.2% context tokens, 0.0% Landlock CPU overhead">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    </style>
  </defs>

  <!-- Quiet Instrument Eyebrow -->
  <text x="0" y="18" class="sans" font-size="10.5" font-weight="600" letter-spacing="1.4" fill="#8b949e">SYSTEMS · KERNEL CONTAINMENT · AGENT INFRASTRUCTURE</text>
  <text x="840" y="18" text-anchor="end" class="mono" font-size="10.5" font-weight="500" letter-spacing="0.6" fill="#8b949e">C11  ·  LINUX LSM  ·  ADVERSARIAL VERIFICATION</text>

  <!-- Top Hairline + Racing Stripe (Accent 1/3) -->
  <line x1="0" y1="32" x2="840" y2="32" stroke="#21262d" stroke-width="1"/>
  <line x1="0" y1="32" x2="56" y2="32" stroke="#df9f64" stroke-width="2"/>

  <!-- Column Dividers -->
  <line x1="272" y1="50" x2="272" y2="164" stroke="#21262d" stroke-width="1"/>
  <line x1="558" y1="50" x2="558" y2="164" stroke="#21262d" stroke-width="1"/>

  <!-- Column 1: 1.3 ms -->
  <text x="0" y="94" class="mono" letter-spacing="-1.5" fill="#f0f6fc"><tspan font-size="44" font-weight="700">1.3</tspan><tspan dx="6" font-size="19" font-weight="500" letter-spacing="0" fill="#8b949e">ms</tspan></text>
  <text x="0" y="124" class="sans" font-size="13.5" font-weight="600" fill="#f0f6fc">hslice · mmap 3-gram &amp; AST slicer</text>
  <text x="0" y="146" class="sans" font-size="12" fill="#8b949e">Single-shot symbol &amp; call-graph slice</text>
  <line x1="0" y1="164" x2="160" y2="164" stroke="#21262d" stroke-width="1.5"/>
  <line x1="0" y1="164" x2="24" y2="164" stroke="#df9f64" stroke-width="2"/>

  <!-- Column 2: −96.2% -->
  <text x="298" y="94" class="mono" font-size="44" font-weight="700" letter-spacing="-1.5" fill="#f0f6fc">&#x2212;96.2%</text>
  <text x="298" y="124" class="sans" font-size="13.5" font-weight="600" fill="#f0f6fc">Agent file-read context tokens</text>
  <text x="298" y="146" class="sans" font-size="12" fill="#8b949e">36,517 &#x2192; 1,384 tok across 1 turn</text>
  <line x1="298" y1="164" x2="458" y2="164" stroke="#21262d" stroke-width="1.5"/>
  <line x1="298" y1="164" x2="304" y2="164" stroke="#df9f64" stroke-width="2"/>

  <!-- Column 3: 0.0% -->
  <text x="584" y="94" class="mono" font-size="44" font-weight="700" letter-spacing="-1.5" fill="#f0f6fc">0.0%</text>
  <text x="584" y="124" class="sans" font-size="13.5" font-weight="600" fill="#f0f6fc">hshield · Landlock ABI v6 sandbox</text>
  <text x="584" y="146" class="sans" font-size="12" fill="#8b949e">Unprivileged FS, TCP &amp; Pickle VM gate</text>
  <line x1="584" y1="164" x2="744" y2="164" stroke="#21262d" stroke-width="1.5"/>

  <!-- Bottom Hairline -->
  <line x1="0" y1="183" x2="840" y2="183" stroke="#21262d" stroke-width="1"/>
</svg>
